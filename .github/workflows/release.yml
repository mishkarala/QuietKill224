name: Build Magisk Module with Hash

on:
  release:
    types: [published]      # Автоматически при публикации релиза
  workflow_dispatch:        # Можно запустить и вручную (но архив прикрепится только если есть релиз)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate hash file for integrity check
        run: |
          # Создаём файл hash в формате "относительный_путь|sha256"
          # Исключаем служебные файлы и папки
          find . -type f \
            ! -path './.git/*' \
            ! -name '.gitignore' \
            ! -name '*.yml' \
            ! -name 'hash' \
            ! -name 'release.json' \
            -printf '%P\0' | while IFS= read -r -d '' file; do
              sha256sum "$file" | awk '{print $2 "|" $1}'
          done > hash
          echo "Hash file generated:"
          cat hash

      - name: Create Magisk-compatible ZIP (flat structure)
        run: |
          # Упаковываем всё содержимое текущей папки без родительской папки
          zip -r QuiteKill-${{ github.ref_name }}.zip . \
            -x '*.git*' \
            -x '.github/*' \
            -x '.gitignore' \
            -x '*.yml'

      - name: Upload ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: QuiteKill-${{ github.ref_name }}.zip
