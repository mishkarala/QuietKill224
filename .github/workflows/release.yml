name: Build and Upload to Release

on:
  release:
    types: [published]
  workflow_dispatch:   # чтобы можно было запустить вручную для теста

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create ZIP archive (flat structure)
        run: |
          # Упаковываем всё содержимое текущей папки без создания родительской папки
          zip -r QuiteKill-${{ github.ref_name }}.zip . \
            -x '*.git*' \
            -x '.github/*' \
            -x '.gitignore' \
            -x '*.yml'

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: QuiteKill-${{ github.ref_name }}.zip
