name: Build Magisk Module with Hash

# Событие для автоматического запуска при публикации релиза
on:
  release:
    types: [published]

# Предоставляем права GITHUB_TOKEN на запись в репозиторий
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # Используем обновлённую версию v5
        uses: actions/checkout@v5

      - name: Generate hash file
        run: |
          find . -type f \
            ! -path './.git/*' \
            ! -name '.gitignore' \
            ! -name '*.yml' \
            ! -name 'hash' \
            -printf '%P\0' | while IFS= read -r -d '' file; do
              sha256sum "$file" | awk '{print $2 "|" $1}'
          done > hash
          echo "Hash file generated"

      - name: Create Magisk ZIP
        run: |
          zip -r QuiteKill-${{ github.ref_name }}.zip . \
            -x '*.git*' \
            -x '.github/*' \
            -x '.gitignore' \
            -x '*.yml'

      - name: Upload to release
        # Используем обновлённую версию v3
        uses: softprops/action-gh-release@v3
        with:
          # Используем GITHUB_TOKEN, так как мы выдали ему права write
          token: ${{ secrets.GITHUB_TOKEN }}
          files: QuiteKill-${{ github.ref_name }}.zip
